[package]
name = "browser-mcp"
version = "0.0.0-local"
edition = "2024"

[lints.rust]
elided_lifetimes_in_paths = "allow"
rust_2018_idioms = { priority = -1, level = "deny" }

[lints.clippy]
module_inception = "allow"
uninlined_format_args = "allow"

[profile.release]
opt-level = 3
debug = false
lto = true
strip = "debuginfo"
panic = 'unwind'
incremental = false
codegen-units = 1
rpath = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
chromiumoxide = "0.9.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1"
futures-util = "0.3"
rmcp = { version = "3.5.1", features = ["server", "schemars", "transport-io"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.2", features = ["full"] }
self_update = { version = "1.3", default-features = false, features = [
  "github",
  "reqwest",
  "rustls",
  "async",
  "archive-tar",
  "compression-tar-gz",
  "checksums",
] }